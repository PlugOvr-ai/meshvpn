name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Lint shell scripts
        run: shellcheck install.sh deploy.sh tests/macos/smoke.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Smoke test (two nodes, utun, launchd)
        run: tests/macos/smoke.sh target/release/meshvpn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Wintun (the network driver; checksum of the official 0.14.1 release)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          if ((Get-FileHash wintun.zip).Hash -ne "07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51") { throw "wintun checksum mismatch" }
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll target\release\
      - name: Smoke test (two nodes, Wintun, scheduled task)
        shell: pwsh
        run: tests\windows\smoke.ps1 target\release\meshvpn.exe
      - name: install.ps1 in Windows PowerShell 5.1 (as users run it, from a local copy of a release)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force rel, s | Out-Null
          Copy-Item target\release\meshvpn.exe, target\release\wintun.dll s\
          Compress-Archive s\* rel\meshvpn-x86_64-pc-windows-msvc.zip
          (Get-FileHash rel\meshvpn-x86_64-pc-windows-msvc.zip).Hash.ToLower() + "  meshvpn-x86_64-pc-windows-msvc.zip" | Set-Content rel\meshvpn-x86_64-pc-windows-msvc.zip.sha256
          Copy-Item install.ps1 rel\
          $srv = Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", "rel" -PassThru -NoNewWindow
          Start-Sleep 2
          $env:MESHVPN_DOWNLOAD_URL = "http://127.0.0.1:8765"
          irm http://127.0.0.1:8765/install.ps1 | iex
          $v = & "$env:ProgramFiles\meshvpn\meshvpn.exe" --version
          if ($LASTEXITCODE -ne 0 -or $v -notmatch "meshvpn") { throw "not installed: $v" }
          # Again, now that it is installed (the update path).
          irm http://127.0.0.1:8765/install.ps1 | iex
          Stop-Process -Id $srv.Id -Force
          Write-Host "install.ps1 works in Windows PowerShell $($PSVersionTable.PSVersion)"

  e2e:
    uses: ./.github/workflows/e2e.yml
