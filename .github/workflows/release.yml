name: Release

# Push a tag like `v0.2.0` to publish a release with binaries, .deb/.rpm packages
# and the one-line installer.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0); created from the selected branch if missing"
        required: true

# Read-only; only the job that publishes may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  tag:
    # A tag given by hand (workflow_dispatch) goes into sed and file names: only vX.Y.Z.
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The changelog has this release
        run: |
          grep -Eq "^## \[${TAG#v}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }

  build:
    needs: tag
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # PCs, servers, VMs
          - { target: x86_64-unknown-linux-musl, packages: true }
          # Raspberry Pi 3/4/5 (64 bit OS), ARM servers, Jetson, ...
          - { target: aarch64-unknown-linux-musl, packages: true }
          # Raspberry Pi 2/3/4 (32 bit OS), most ARM routers and SBCs
          - { target: armv7-unknown-linux-musleabihf, packages: true }
          # Raspberry Pi Zero / 1
          - { target: arm-unknown-linux-musleabihf, packages: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cross,cargo-deb,cargo-generate-rpm

      - name: Set version from tag
        run: |
          version="${TAG#v}"
          sed -i "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Build (fully static, runs on any Linux distribution)
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p dist staging
          python3 scripts/third-party-licenses.py > staging/THIRD-PARTY-LICENSES.txt
          cp target/${{ matrix.target }}/release/meshvpn README.md LICENSE staging/
          tar -czf dist/meshvpn-${{ matrix.target }}.tar.gz -C staging .

      - name: Package .deb and .rpm
        if: matrix.packages
        run: |
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --output dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  macos:
    needs: tag
    # Built natively on a Mac (both architectures), after the macOS smoke test.
    name: build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Set version from tag
        run: |
          version="${TAG#v}"
          sed -i '' "1,/^version = /s/^version = .*/version = \"$version\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
      - name: Build
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Smoke test (two nodes, utun, launchd)
        run: tests/macos/smoke.sh target/aarch64-apple-darwin/release/meshvpn
      - name: Package archives
        run: |
          mkdir -p dist
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            rm -rf staging && mkdir staging
            python3 scripts/third-party-licenses.py > staging/THIRD-PARTY-LICENSES.txt
            cp target/$t/release/meshvpn README.md LICENSE staging/
            tar -czf dist/meshvpn-$t.tar.gz -C staging .
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-macos
          path: dist/*

  windows:
    needs: tag
    name: build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Set version from tag
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart("v")
          $c = Get-Content Cargo.toml -Raw
          $c = ([regex]'(?m)^version = ".*"').Replace($c, "version = `"$v`"", 1)
          Set-Content Cargo.toml $c -NoNewline
          Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1
      - run: cargo build --release
      - name: Wintun (the network driver; checksum of the official 0.14.1 release)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          if ((Get-FileHash wintun.zip).Hash -ne "07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51") { throw "wintun checksum mismatch" }
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll target\release\
      - name: Smoke test (two nodes, Wintun, scheduled task)
        shell: pwsh
        run: tests\windows\smoke.ps1 target\release\meshvpn.exe
      - name: Package (zip for people, tar.gz for meshvpn update)
        shell: pwsh
        run: |
          $t = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force dist, staging | Out-Null
          Copy-Item target\release\meshvpn.exe, target\release\wintun.dll, README.md, LICENSE staging\
          Copy-Item wintun\wintun\LICENSE.txt staging\wintun-LICENSE.txt
          Compress-Archive staging\* dist\meshvpn-$t.zip
          tar -czf dist\meshvpn-$t.tar.gz -C staging .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-windows
          path: dist/*

  desktop:
    needs: tag
    # The desktop bundle (static Xvfb etc., see desktop/build-bundle.sh), natively per arch.
    name: desktop bundle ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        run: docker run --rm -v "$PWD/desktop:/build:ro" -v "$PWD/desktop-out:/out" alpine:3.22 sh /build/build-bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-desktop-${{ matrix.arch }}
          path: desktop-out/*.tar.gz

  e2e:
    uses: ./.github/workflows/e2e.yml

  release:
    permissions:
      contents: write
    # Published only when every end-to-end test passed.
    needs: [build, macos, windows, desktop, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-cyclonedx
      - name: SBOM (CycloneDX)
        run: |
          # The software bill of materials: every crate the released program is built from.
          sed -i "0,/^version = .*/s//version = \"${TAG#v}\"/" Cargo.toml
          cargo cyclonedx --format json
          mv ./*.cdx.json dist/meshvpn-${TAG}.cdx.json
          git checkout Cargo.toml Cargo.lock
          jq -e '.components | length > 50' dist/meshvpn-${TAG}.cdx.json

      - name: Checksums
        working-directory: dist
        run: |
          cp ../install.sh ../install.ps1 ../deploy.sh .
          for f in *.tar.gz *.zip *.run; do [ -e "$f" ] || continue; sha256sum "$f" > "$f.sha256"; done
          sha256sum -- meshvpn-* *.deb *.rpm install.sh install.ps1 deploy.sh | grep -v '\.sha256$' > SHA256SUMS
          ls -l

      - name: Release notes
        run: |
          cat > notes.md <<NOTES
          ## Install

          **Any Linux machine** (x86_64, ARM64, ARMv7, ARMv6 / Raspberry Pi; static binary, no dependencies):

          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh | sudo sh
          \`\`\`

          Install and join a network in one step (the service starts automatically):

          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo sh -s -- join mesh1-...
          \`\`\`

          **With a desktop for \`meshvpn desktop\`** (Xfce, MATE or Cinnamon from the system's package manager):

          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo sh -s -- --desktop mate join mesh1-...
          \`\`\`

          **macOS** (Apple Silicon and Intel; the same installer):

          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh | sudo sh
          \`\`\`

          **Windows 10/11** (x86_64), in an administrator PowerShell:

          \`\`\`powershell
          irm https://github.com/${{ github.repository }}/releases/download/${TAG}/install.ps1 | iex
          \`\`\`

          **A device without internet access** that you can SSH into from a jump host. Run this on the jump host; nothing is installed there:

          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/deploy.sh | sh -s -- --invite mesh1-... user@localhost -p 2222
          \`\`\`

          **Debian / Ubuntu / Raspberry Pi OS:** download the \`.deb\` for your architecture, then \`sudo apt install ./meshvpn_*.deb\`
          **Fedora / RHEL / openSUSE:** download the \`.rpm\`, then \`sudo dnf install ./meshvpn-*.rpm\`
          **Manual:** unpack \`meshvpn-<target>.tar.gz\` and put \`meshvpn\` in your \`PATH\`.

          | File | Devices |
          |---|---|
          | \`x86_64-unknown-linux-musl\` / \`amd64\` | PCs, servers, VMs |
          | \`aarch64-unknown-linux-musl\` / \`arm64\` | Raspberry Pi 3/4/5 (64 bit), ARM servers |
          | \`armv7-unknown-linux-musleabihf\` / \`armhf\` | Raspberry Pi 2/3/4 (32 bit), routers, SBCs |
          | \`arm-unknown-linux-musleabihf\` | Raspberry Pi Zero / 1 |
          | \`aarch64-apple-darwin\` / \`x86_64-apple-darwin\` | Macs (Apple Silicon / Intel) |
          | \`x86_64-pc-windows-msvc\` (.zip) | Windows 10/11 PCs (with wintun.dll) |

          Then: \`sudo meshvpn init\` to create a network, or \`sudo meshvpn join <invite>\` to join one.
          NOTES
          # This release's section of the changelog first.
          awk -v v="${TAG#v}" '/^## /{p = index($0, "[" v "]") == 4; next} p' CHANGELOG.md > changes.md
          if [ -s changes.md ]; then { echo "## Changes"; cat changes.md; echo; cat notes.md; } > n.md && mv n.md notes.md; fi

      - name: Nothing but files to publish
        run: |
          # A directory fails only at the very end, an hour in.
          if [ -n "$(find dist -mindepth 1 -type d)" ]; then find dist -mindepth 1 -type d; exit 1; fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "meshvpn $TAG" --notes-file notes.md \
              --generate-notes --target "${{ github.sha }}"
          fi
