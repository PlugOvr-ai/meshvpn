name: E2E

# End-to-end tests: real meshvpn nodes in Docker containers (tests/e2e/run.py).
# Called by CI on every push and by the release workflow before publishing.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build the static binary
        run: cross build --release --target x86_64-unknown-linux-musl
      - name: Desktop bundle (cached until desktop/build-bundle.sh changes)
        id: bundle
        uses: actions/cache@v6
        with:
          path: desktop-out
          key: desktop-bundle-x86_64-${{ hashFiles('desktop/build-bundle.sh') }}
      - name: Build the desktop bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        run: docker run --rm -v "$PWD/desktop:/build:ro" -v "$PWD/desktop-out:/out" alpine:3.22 sh /build/build-bundle.sh
      - name: Make sure the TUN module is loaded
        run: sudo modprobe tun || true
      - name: End-to-end tests
        run: >
          python3 tests/e2e/run.py --binary target/x86_64-unknown-linux-musl/release/meshvpn
          --desktop-bundle desktop-out/meshvpn-desktop-x86_64.tar.gz -j 4
